<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم النظام العائم (العقل المدبر)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center">🎛️ غرفة العمليات - النظام العائم</h1>

        <!-- 1. قسم مصدر البث -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-green-400">1. مصدر البث (الرابط الأصلي)</h2>
            <div class="flex gap-4">
                <input type="text" id="sourceLink" placeholder="ضع رابط .m3u8 الأصلي هنا..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="updateSource()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded transition flex-shrink-0">حفظ المصدر في القاعدة</button>
            </div>
        </div>

        <!-- 2. قسم استبدال الدومين -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-yellow-400">2. دومين الطوارئ (Cloudflare Worker)</h2>
            <div class="flex gap-4">
                <input type="text" id="cfDomain" placeholder="مثال: https://worker-name.username.workers.dev" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="updateDomain()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded transition flex-shrink-0">استبدال وربط فوري</button>
            </div>
        </div>

        <!-- 3. قسم إدارة العمال -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-purple-400">3. إدارة العمال (الزرع والتشغيل)</h2>
            
            <div class="flex gap-4 mb-6">
                <input type="text" id="githubToken" placeholder="ضع الـ API Token للحساب الفرعي هنا..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="plantScript()" id="plantBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded transition flex-shrink-0">زرع المحرك (FFmpeg)</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300">
                            <th class="p-3 border border-gray-600">الحساب (Username)</th>
                            <th class="p-3 border border-gray-600">المستودع</th>
                            <th class="p-3 border border-gray-600">تشغيل البث</th>
                            <th class="p-3 border border-gray-600">الترافيك</th>
                            <th class="p-3 border border-gray-600">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="workersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLovuI6IOGsl2BrIgN9CImS4FgfY9xuY",
            authDomain: "floating-project-afc8f.firebaseapp.com",
            databaseURL: "https://floating-project-afc8f-default-rtdb.firebaseio.com",
            projectId: "floating-project-afc8f",
            storageBucket: "floating-project-afc8f.firebasestorage.app",
            messagingSenderId: "937631435290",
            appId: "1:937631435290:web:127c41f413b2d34d6a1fa3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function updateSource() {
            const link = document.getElementById("sourceLink").value;
            if(!link) return alert("يرجى إدخال رابط البث!");
            db.ref('settings/source').set(link);
            alert("تم حفظ رابط البث في قاعدة البيانات!");
        }

        function updateDomain() {
            const domain = document.getElementById("cfDomain").value;
            if(!domain) return alert("يرجى إدخال الرابط!");
            db.ref('settings/domain').set(domain);
            alert("تم ربط الدومين الجديد!");
        }

        function encodeBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function plantScript() {
            const token = document.getElementById("githubToken").value.trim();
            if(!token) return alert("يرجى إدخال Token!");
            
            const btn = document.getElementById("plantBtn");
            btn.innerText = "جاري الاتصال والزرع...";
            btn.disabled = true;

            try {
                const userRes = await fetch("https://api.github.com/user", {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!userRes.ok) throw new Error("التوكن غير صحيح.");
                const userData = await userRes.json();
                const username = userData.login;

                const randomId = Math.floor(Math.random() * 10000);
                const repoName = "TimeShift-Worker-" + randomId;
                
                await fetch("https://api.github.com/user/repos", {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({ 
                        name: repoName, 
                        private: false, 
                        auto_init: true
                    })
                });

                await new Promise(resolve => setTimeout(resolve, 1500));

                // المحرك الحقيقي لمعالجة البث (FFmpeg & PNG camouflage)
                const workflowContent = `name: FFmpeg Stream Engine
on:
  workflow_dispatch:
jobs:
  process-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Process and Convert to PNG
        run: |
          git config --global user.name "TimeShift Worker"
          git config --global user.email "worker@timeshift.local"
          mkdir -p live_stream
          
          echo "Fetching source link from Firebase..."
          SOURCE_URL=$(curl -s https://floating-project-afc8f-default-rtdb.firebaseio.com/settings/source.json | tr -d '"')
          
          if [ "$SOURCE_URL" != "null" ] && [ -n "$SOURCE_URL" ]; then
            echo "Processing stream..."
            # تشغيل FFmpeg للتحويل إلى صيغة الصور الوهمية .png
            ffmpeg -i "$SOURCE_URL" -c copy -f hls -hls_time 4 -hls_list_size 5 -hls_flags delete_segments -hls_segment_filename "live_stream/segment_%03d.png" live_stream/index.m3u8 &
            
            # حلقة لرفع الأجزاء الجديدة كل 10 ثوانٍ لشبكة CDN
            for i in {1..30}; do
              sleep 10
              git add live_stream/*
              git commit -m "Update stream segments" || true
              git push origin main || true
            done
          else
            echo "No source URL found!"
          fi
`;
                
                await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/.github/workflows/engine.yml`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({
                        message: "Planting FFmpeg Engine",
                        content: encodeBase64(workflowContent)
                    })
                });

                db.ref('workers/' + username + '_' + randomId).set({
                    token: token,
                    status: 'active',
                    trafficUsage: 0,
                    repo: repoName,
                    username: username
                });
                
                document.getElementById("githubToken").value = '';
                alert(`✅ تم زرع المحرك (FFmpeg) بنجاح في المستودع الجديد: ${repoName}`);

            } catch (error) {
                alert("❌ حدث خطأ: " + error.message);
            } finally {
                btn.innerText = "زرع المحرك (FFmpeg)";
                btn.disabled = false;
            }
        }

        async function startWorkerAction(username, repo, token) {
            alert("جاري إرسال أمر التشغيل للخادم...");
            try {
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/actions/workflows/engine.yml/dispatches`, {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({ ref: "main" })
                });
                if(res.ok || res.status === 204) {
                    alert("🚀 بدأ البث والتحويل الآن في حساب العامل!");
                } else {
                    alert("لم يتم التشغيل، تأكد من تحديث رابط البث أولاً.");
                }
            } catch(e) {
                alert("خطأ في التشغيل: " + e.message);
            }
        }

        db.ref('workers').on('value', (snapshot) => {
            const workersTable = document.getElementById('workersTable');
            workersTable.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                const workerId = childSnapshot.key;
                
                const row = `
                    <tr class="bg-gray-800 border-b border-gray-700 text-center">
                        <td class="p-3 font-mono font-bold text-blue-300">${worker.username}</td>
                        <td class="p-3 font-mono text-xs text-gray-400">${worker.repo}</td>
                        <td class="p-3">
                            <button onclick="startWorkerAction('${worker.username}', '${worker.repo}', '${worker.token}')" class="bg-green-600 hover:bg-green-700 text-white text-sm py-1 px-4 rounded font-bold shadow animate-pulse">
                                ▶️ بدء البث
                            </button>
                        </td>
                        <td class="p-3">
                            <div class="w-full bg-gray-600 rounded-full h-4 relative">
                                <div class="${worker.trafficUsage >= 90 ? 'bg-red-500' : 'bg-blue-500'} h-4 rounded-full" style="width: ${worker.trafficUsage}%"></div>
                                <span class="absolute text-xs text-white left-1/2 top-0 transform -translate-x-1/2">${worker.trafficUsage}%</span>
                            </div>
                        </td>
                        <td class="p-3">
                            <button onclick="deleteWorker('${workerId}')" class="bg-gray-600 hover:bg-red-500 text-white text-sm py-1 px-3 rounded w-full transition">حذف العامل</button>
                        </td>
                    </tr>
                `;
                workersTable.innerHTML += row;
            });
        });
        
        function deleteWorker(workerId) {
            if(confirm("هل أنت متأكد من حذف هذا العامل من اللوحة؟ (هذا لا يحذف المستودع من GitHub)")) {
                db.ref('workers/' + workerId).remove();
            }
        }
    </script>
</body>
</html>
