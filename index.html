<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة العمليات - النظام العائم (النسخة الذكية)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center border-b border-gray-700 pb-4">🎛️ العقل المدبر - غرفة العمليات</h1>

        <!-- 1. قسم البث الذكي -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-green-400 flex items-center gap-2">
                <span>📡</span> 1. مصدر البث (دعم الروابط المحمية)
            </h2>
            
            <div class="flex flex-col gap-3 mb-6">
                <label class="text-sm font-bold text-gray-400">الرابط الأصلي (مطلوب):</label>
                <input type="text" id="sourceLink" placeholder="رابط البث (m3u8, ts, css...)" class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-green-300 focus:outline-none focus:border-green-500 font-mono text-left dir-ltr">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2">
                    <div>
                        <label class="text-xs font-bold text-gray-500">User-Agent (اختياري):</label>
                        <input type="text" id="userAgent" placeholder="مثال: OSCARTV2021" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-gray-300 focus:border-blue-500 font-mono text-left dir-ltr text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">Referer (اختياري):</label>
                        <input type="text" id="referer" placeholder="https://example.com" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-gray-300 focus:border-blue-500 font-mono text-left dir-ltr text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">Cookie (اختياري):</label>
                        <input type="text" id="cookie" placeholder="ot=tmzd6f..." class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-gray-300 focus:border-blue-500 font-mono text-left dir-ltr text-sm">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <button onclick="startSmartBroadcast()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg flex justify-center items-center gap-2">
                    <span>▶️</span> 1. تشغيل البث للجميع
                </button>
                <button onclick="stopBroadcast()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg flex justify-center items-center gap-2">
                    <span>⏹️</span> 2. إيقاف البث
                </button>
                <button onclick="clearLink()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg flex justify-center items-center gap-2">
                    <span>🗑️</span> 3. مسح الرابط
                </button>
            </div>
            
            <div class="w-full bg-black rounded-lg overflow-hidden border border-gray-700 relative">
                <div class="absolute top-2 right-2 text-xs text-gray-400 bg-gray-900 px-2 py-1 rounded opacity-80 z-10">شاشة المراقبة المحلية</div>
                <video id="previewPlayer" controls muted playsinline class="w-full h-48 md:h-80 bg-black object-contain"></video>
            </div>
        </div>

        <!-- 2. قسم استبدال الدومين -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-yellow-400 flex items-center gap-2">
                <span>🌐</span> 2. دومين الطوارئ (Cloudflare Worker)
            </h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="cfDomain" placeholder="https://worker-node.workers.dev" class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-yellow-300 focus:outline-none focus:border-yellow-500 font-mono text-left dir-ltr">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="updateDomain()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition shadow">🔗 حفظ وربط الدومين</button>
                    <button onclick="clearDomain()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-lg transition shadow">🗑️ إزالة الدومين</button>
                </div>
            </div>
        </div>

        <!-- 3. قسم إدارة العمال -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-purple-400 flex items-center gap-2">
                <span>🤖</span> 3. إدارة العمال
            </h2>
            
            <div class="flex flex-col gap-3 mb-6 bg-gray-700 p-4 rounded-lg">
                <label class="text-sm text-gray-300 font-bold">إضافة عامل جديد:</label>
                <input type="text" id="githubToken" placeholder="ضع الـ API Token للحساب الفرعي هنا..." class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-purple-300 focus:outline-none focus:border-purple-500 font-mono text-left dir-ltr">
                <button onclick="plantScript()" id="plantBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition shadow">زرع المحرك الذكي (FFmpeg)</button>
            </div>

            <div class="overflow-x-auto border border-gray-700 rounded-lg">
                <table class="w-full text-center border-collapse whitespace-nowrap">
                    <thead class="bg-gray-900">
                        <tr class="text-gray-300 border-b border-gray-700">
                            <th class="p-4 font-bold">الحساب والمستودع</th>
                            <th class="p-4 font-bold">الترافيك</th>
                            <th class="p-4 font-bold">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="workersTable" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLovuI6IOGsl2BrIgN9CImS4FgfY9xuY",
            authDomain: "floating-project-afc8f.firebaseapp.com",
            databaseURL: "https://floating-project-afc8f-default-rtdb.firebaseio.com",
            projectId: "floating-project-afc8f",
            storageBucket: "floating-project-afc8f.firebasestorage.app",
            messagingSenderId: "937631435290",
            appId: "1:937631435290:web:127c41f413b2d34d6a1fa3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('settings/stream').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("sourceLink").value = data.source || "";
                document.getElementById("userAgent").value = data.userAgent || "";
                document.getElementById("referer").value = data.referer || "";
                document.getElementById("cookie").value = data.cookie || "";
            } else {
                document.getElementById("sourceLink").value = "";
                document.getElementById("userAgent").value = "";
                document.getElementById("referer").value = "";
                document.getElementById("cookie").value = "";
                const video = document.getElementById('previewPlayer');
                video.pause();
                video.src = "";
            }
        });

        db.ref('settings/domain').on('value', (snapshot) => {
            const domain = snapshot.val();
            document.getElementById("cfDomain").value = domain || "";
        });

        function playVideo(url) {
            const video = document.getElementById('previewPlayer');
            if (url.includes('.m3u8') || url.includes('.ts')) {
                if (Hls.isSupported() && url.includes('.m3u8')) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                } else {
                    video.src = url;
                    video.play();
                }
            }
        }

        async function startSmartBroadcast() {
            const link = document.getElementById("sourceLink").value;
            const ua = document.getElementById("userAgent").value;
            const ref = document.getElementById("referer").value;
            const cookie = document.getElementById("cookie").value;
            
            if(!link) return alert("يرجى إدخال الرابط الأصلي!");
            
            await db.ref('settings/stream').set({
                source: link,
                userAgent: ua || "",
                referer: ref || "",
                cookie: cookie || "",
                status: "running"
            });
            
            playVideo(link);
            
            const workersRef = await db.ref('workers').once('value');
            const workers = workersRef.val();
            if (workers) {
                for (let key in workers) {
                    if (workers[key].status === 'active') {
                        fetch(`https://api.github.com/repos/${workers[key].username}/${workers[key].repo}/actions/workflows/engine.yml/dispatches`, {
                            method: "POST",
                            headers: { "Authorization": `token ${workers[key].token}`, "Accept": "application/vnd.github.v3+json" },
                            body: JSON.stringify({ ref: "main" })
                        }).catch(e => {});
                    }
                }
                alert("✅ تم إرسال أمر التشغيل للعمال!");
            }
        }

        function stopBroadcast() {
            db.ref('settings/stream/status').set("stopped");
            alert("🛑 تم إرسال أمر الإيقاف.");
        }

        function clearLink() {
            db.ref('settings/stream').remove();
            alert("🗑️ تم مسح الرابط.");
        }

        function updateDomain() {
            const domain = document.getElementById("cfDomain").value;
            if(!domain) return alert("يرجى إدخال الرابط!");
            const cleanDomain = domain.endsWith('/') ? domain.slice(0, -1) : domain;
            db.ref('settings/domain').set(cleanDomain);
            alert("✅ تم الحفظ!");
        }

        function clearDomain() {
            db.ref('settings/domain').remove();
            alert("🗑️ تم المسح.");
        }

        function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

        async function plantScript() {
            const token = document.getElementById("githubToken").value.trim();
            if(!token) return alert("يرجى إدخال Token!");
            
            const btn = document.getElementById("plantBtn");
            btn.innerText = "جاري الزرع...";
            btn.disabled = true;

            try {
                const userRes = await fetch("https://api.github.com/user", { headers: { "Authorization": `token ${token}` } });
                if (!userRes.ok) throw new Error("التوكن غير صحيح.");
                const userData = await userRes.json();
                const username = userData.login;

                const randomId = Math.floor(Math.random() * 10000);
                const repoName = "TimeShift-Worker-" + randomId;
                
                await fetch("https://api.github.com/user/repos", {
                    method: "POST",
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify({ name: repoName, private: false, auto_init: true })
                });

                await new Promise(resolve => setTimeout(resolve, 1500));

                const workflowContent = `name: Smart FFmpeg Engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  process-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies (FFmpeg & jq)
        run: sudo apt-get update && sudo apt-get install -y jq ffmpeg

      - name: Process Smart Stream
        run: |
          git config --global user.name "TimeShift Worker"
          git config --global user.email "worker@timeshift.local"
          mkdir -p live_stream
          
          STREAM_DATA=$(curl -s https://floating-project-afc8f-default-rtdb.firebaseio.com/settings/stream.json)
          STATUS=$(echo "$STREAM_DATA" | jq -r '.status')
          
          if [ "$STATUS" != "running" ]; then
            echo "Stream is not running. Exiting."
            exit 0
          fi
          
          SOURCE=$(echo "$STREAM_DATA" | jq -r '.source')
          UA=$(echo "$STREAM_DATA" | jq -r '.userAgent')
          REF=$(echo "$STREAM_DATA" | jq -r '.referer')
          COOKIE=$(echo "$STREAM_DATA" | jq -r '.cookie')
          
          CMD="ffmpeg"
          if [ "$UA" != "" ] && [ "$UA" != "null" ]; then
            CMD="$CMD -user_agent \\"$UA\\""
          fi
          
          CRLF=$(printf '\\015\\012')
          HEADERS=""
          if [ "$REF" != "" ] && [ "$REF" != "null" ]; then
            HEADERS="\${HEADERS}Referer: \${REF}\${CRLF}"
          fi
          if [ "$COOKIE" != "" ] && [ "$COOKIE" != "null" ]; then
            HEADERS="\${HEADERS}Cookie: \${COOKIE}\${CRLF}"
          fi
          
          if [ -n "$HEADERS" ]; then
            CMD="$CMD -headers \\"$HEADERS\\""
          fi
          
          CMD="$CMD -i \\"$SOURCE\\" -c copy -f hls -hls_time 4 -hls_list_size 5 -hls_flags delete_segments -hls_segment_filename \\"live_stream/segment_%03d.png\\" live_stream/index.m3u8"
          
          eval "$CMD" &
          PID=$!
          
          for i in {1..30}; do
            sleep 10
            
            CURRENT_STATUS=$(curl -s https://floating-project-afc8f-default-rtdb.firebaseio.com/settings/stream/status.json | tr -d '"')
            if [ "$CURRENT_STATUS" == "stopped" ]; then
              echo "Stop command received! Stopping FFmpeg..."
              kill $PID
              break
            fi
            
            git add live_stream/ || true
            git commit -m "Update stream" || true
            git push origin main || true
          done
`;
                
                await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/.github/workflows/engine.yml`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify({ message: "Init Smart Engine", content: encodeBase64(workflowContent) })
                });

                db.ref('workers/' + username + '_' + randomId).set({
                    token: token,
                    status: 'active',
                    trafficUsage: 0,
                    repo: repoName,
                    username: username
                });
                
                document.getElementById("githubToken").value = '';
                alert(`✅ تم زرع المحرك بنجاح في: ${repoName}`);

            } catch (error) {
                alert("❌ خطأ: " + error.message);
            } finally {
                btn.innerText = "زرع المحرك الذكي (FFmpeg)";
                btn.disabled = false;
            }
        }

        db.ref('workers').on('value', (snapshot) => {
            const workersTable = document.getElementById('workersTable');
            workersTable.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                const workerId = childSnapshot.key;
                const usage = worker.trafficUsage || 0;
                
                const row = `
                    <tr class="hover:bg-gray-800 transition">
                        <td class="p-4 text-right">
                            <div class="font-bold text-blue-300 text-lg">${worker.username}</div>
                            <div class="text-sm text-gray-500 font-mono">${worker.repo}</div>
                        </td>
                        <td class="p-4 w-1/3">
                            <div class="flex items-center gap-2">
                                <span class="font-bold w-10 text-left ${usage > 85 ? 'text-red-500' : 'text-green-400'}">${usage}%</span>
                                <div class="w-full bg-gray-700 rounded-full h-3">
                                    <div class="h-3 rounded-full ${usage > 85 ? 'bg-red-500' : 'bg-green-500'}" style="width: ${usage}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 flex gap-2 justify-center">
                            <button onclick="deleteWorker('${workerId}')" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded shadow text-sm">حذف</button>
                        </td>
                    </tr>
                `;
                workersTable.innerHTML += row;
            });
        });
        
        function deleteWorker(workerId) {
            if(confirm("هل أنت متأكد من حذف هذا العامل؟")) db.ref('workers/' + workerId).remove();
        }
    </script>
</body>
</html>
