<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL - TimeShift Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- مكتبة HLS.js لتشغيل البث داخل اللوحة -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* ستايل الهاكر المخصص */
        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
        }
        .neon-border {
            border: 1px solid #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 5px #0f0;
        }
        .btn-hack {
            background-color: #000;
            border: 1px solid #0f0;
            color: #0f0;
            transition: all 0.3s;
        }
        .btn-hack:hover {
            background-color: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }
        .btn-alert {
            background-color: #000;
            border: 1px solid #f00;
            color: #f00;
        }
        .btn-alert:hover {
            background-color: #f00;
            color: #000;
            box-shadow: 0 0 15px #f00;
        }
        input {
            background-color: #0a0a0a !important;
            border: 1px solid #0f0 !important;
            color: #0f0 !important;
        }
        input:focus {
            box-shadow: 0 0 10px #0f0;
            outline: none;
        }
        /* تصميم عداد السيارة الدائري */
        .gauge-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #111;
            margin: 0 auto;
        }
        .gauge-inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center neon-text">> SYSTEM_MASTER :: TIME_SHIFT_PROTOCOL _</h1>

        <!-- 1. قسم مصدر البث وشاشة العرض -->
        <div class="neon-border p-6 rounded mb-6">
            <h2 class="text-xl font-bold mb-4">> [1] SOURCE_STREAM_CONTROL</h2>
            <div class="flex gap-4 mb-4">
                <input type="text" id="sourceLink" placeholder="Enter .m3u8 or .ts target..." class="w-full p-3 rounded">
                <button onclick="updateSource()" class="btn-hack font-bold py-3 px-6 rounded flex-shrink-0">[ INJECT_SOURCE ]</button>
            </div>
            
            <!-- شاشة عرض البث المباشر -->
            <div class="w-full bg-black neon-border rounded overflow-hidden relative">
                <div class="absolute top-2 left-2 text-xs opacity-70 z-10">> LIVE_MONITORING...</div>
                <video id="previewPlayer" controls class="w-full h-64 bg-black object-contain"></video>
            </div>
            
            <!-- زر الاستنفار العام -->
            <button onclick="startAllWorkers()" class="w-full mt-4 btn-alert font-bold py-3 px-6 rounded animate-pulse">
                [!] EXECUTE_MASS_STREAMING_PROTOCOL (ALL_WORKERS) [!]
            </button>
        </div>

        <!-- 2. قسم استبدال الدومين -->
        <div class="neon-border p-6 rounded mb-6">
            <h2 class="text-xl font-bold mb-4">> [2] CLOUDFLARE_NODE_ROUTING</h2>
            <div class="flex gap-4">
                <input type="text" id="cfDomain" placeholder="https://worker-node.workers.dev..." class="w-full p-3 rounded">
                <button onclick="updateDomain()" class="btn-hack font-bold py-3 px-6 rounded flex-shrink-0">[ BIND_NODE ]</button>
            </div>
        </div>

        <!-- 3. قسم إدارة العمال -->
        <div class="neon-border p-6 rounded">
            <h2 class="text-xl font-bold mb-4">> [3] WORKER_DRONES_MANAGEMENT</h2>
            
            <div class="flex gap-4 mb-6">
                <input type="text" id="githubToken" placeholder="Insert Worker API Token..." class="w-full p-3 rounded">
                <button onclick="plantScript()" id="plantBtn" class="btn-hack font-bold py-3 px-6 rounded flex-shrink-0">[ DEPLOY_FFMPEG_ENGINE ]</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="border-b border-green-500 text-green-400">
                            <th class="p-3">> TARGET_ID</th>
                            <th class="p-3">> REPOSITORY</th>
                            <th class="p-3">> INDIVIDUAL_EXEC</th>
                            <th class="p-3">> LOAD_METER</th>
                            <th class="p-3">> ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="workersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLovuI6IOGsl2BrIgN9CImS4FgfY9xuY",
            authDomain: "floating-project-afc8f.firebaseapp.com",
            databaseURL: "https://floating-project-afc8f-default-rtdb.firebaseio.com",
            projectId: "floating-project-afc8f",
            storageBucket: "floating-project-afc8f.firebasestorage.app",
            messagingSenderId: "937631435290",
            appId: "1:937631435290:web:127c41f413b2d34d6a1fa3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // دالة تشغيل الفيديو في اللوحة
        function playVideo(url) {
            const video = document.getElementById('previewPlayer');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                video.src = url; // صيغ أخرى مثل MP4
                video.play();
            }
        }

        function updateSource() {
            const link = document.getElementById("sourceLink").value;
            if(!link) return alert("> ERROR: NO_SOURCE_PROVIDED");
            db.ref('settings/source').set(link);
            playVideo(link); // تشغيل البث أمامك
            alert("> SUCCESS: SOURCE_INJECTED_TO_DATABASE");
        }

        function updateDomain() {
            const domain = document.getElementById("cfDomain").value;
            if(!domain) return alert("> ERROR: NO_DOMAIN_PROVIDED");
            db.ref('settings/domain').set(domain);
            alert("> SUCCESS: NODE_ROUTING_UPDATED");
        }

        function encodeBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function plantScript() {
            const token = document.getElementById("githubToken").value.trim();
            if(!token) return alert("> ERROR: TOKEN_REQUIRED");
            
            const btn = document.getElementById("plantBtn");
            btn.innerText = "[ DEPLOYING... ]";
            btn.disabled = true;

            try {
                const userRes = await fetch("https://api.github.com/user", {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!userRes.ok) throw new Error("INVALID_TOKEN");
                const userData = await userRes.json();
                const username = userData.login;

                const randomId = Math.floor(Math.random() * 10000);
                const repoName = "TimeShift-Worker-" + randomId;
                
                await fetch("https://api.github.com/user/repos", {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({ name: repoName, private: false, auto_init: true })
                });

                await new Promise(resolve => setTimeout(resolve, 1500));

                const workflowContent = `name: FFmpeg Stream Engine
on:
  workflow_dispatch:
jobs:
  process-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Process and Convert to PNG
        run: |
          git config --global user.name "TimeShift Worker"
          git config --global user.email "worker@timeshift.local"
          mkdir -p live_stream
          
          echo "Fetching source..."
          SOURCE_URL=$(curl -s https://floating-project-afc8f-default-rtdb.firebaseio.com/settings/source.json | tr -d '"')
          
          if [ "$SOURCE_URL" != "null" ] && [ -n "$SOURCE_URL" ]; then
            ffmpeg -i "$SOURCE_URL" -c copy -f hls -hls_time 4 -hls_list_size 5 -hls_flags delete_segments -hls_segment_filename "live_stream/segment_%03d.png" live_stream/index.m3u8 &
            
            for i in {1..30}; do
              sleep 10
              git add live_stream/*
              git commit -m "Update stream" || true
              git push origin main || true
            done
          fi
`;
                
                await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/.github/workflows/engine.yml`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({ message: "Init Engine", content: encodeBase64(workflowContent) })
                });

                db.ref('workers/' + username + '_' + randomId).set({
                    token: token,
                    status: 'active',
                    trafficUsage: Math.floor(Math.random() * 15), // قيمة ابتدائية للتجربة
                    repo: repoName,
                    username: username
                });
                
                document.getElementById("githubToken").value = '';
                alert(`> SUCCESS: WORKER_DEPLOYED [${repoName}]`);

            } catch (error) {
                alert("> ERROR: " + error.message);
            } finally {
                btn.innerText = "[ DEPLOY_FFMPEG_ENGINE ]";
                btn.disabled = false;
            }
        }

        async function startWorkerAction(username, repo, token) {
            try {
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/actions/workflows/engine.yml/dispatches`, {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({ ref: "main" })
                });
                if(res.ok || res.status === 204) alert(`> WORKER [${username}] STARTED`);
            } catch(e) {}
        }

        async function startAllWorkers() {
            const workersRef = await db.ref('workers').once('value');
            const workers = workersRef.val();
            if (!workers) return alert("> ERROR: NO_WORKERS_FOUND");
            
            for (let key in workers) {
                let worker = workers[key];
                if (worker.status === 'active') {
                    fetch(`https://api.github.com/repos/${worker.username}/${worker.repo}/actions/workflows/engine.yml/dispatches`, {
                        method: "POST",
                        headers: { "Authorization": `token ${worker.token}`, "Accept": "application/vnd.github.v3+json" },
                        body: JSON.stringify({ ref: "main" })
                    }).catch(e => {});
                }
            }
            alert("> SUCCESS: MASS_EXECUTION_COMMAND_SENT_TO_ALL_WORKERS");
        }

        // تحديث الجدول ورسم عداد السيارة
        db.ref('workers').on('value', (snapshot) => {
            const workersTable = document.getElementById('workersTable');
            workersTable.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                const workerId = childSnapshot.key;
                
                // حساب لون العداد الدائري بناءً على الضغط
                const usage = worker.trafficUsage || 0;
                let gaugeColor = "#0f0"; // أخضر
                if(usage > 50) gaugeColor = "#ff0"; // أصفر
                if(usage > 85) gaugeColor = "#f00"; // أحمر

                const row = `
                    <tr class="border-b border-gray-800 hover:bg-gray-900 transition">
                        <td class="p-3">${worker.username}</td>
                        <td class="p-3 text-xs opacity-70">${worker.repo}</td>
                        <td class="p-3">
                            <button onclick="startWorkerAction('${worker.username}', '${worker.repo}', '${worker.token}')" class="btn-hack text-xs py-1 px-3 rounded">
                                [ RUN ]
                            </button>
                        </td>
                        <td class="p-3">
                            <!-- عداد يشبه عداد السيارة -->
                            <div class="gauge-container" style="background: conic-gradient(${gaugeColor} ${usage}%, #111 ${usage}% 100%); box-shadow: 0 0 10px ${gaugeColor}40;">
                                <div class="gauge-inner ${usage > 85 ? 'text-red-500 animate-pulse' : 'text-green-500'}">
                                    ${usage}%
                                </div>
                            </div>
                        </td>
                        <td class="p-3">
                            <button onclick="deleteWorker('${workerId}')" class="btn-alert text-xs py-1 px-3 rounded">
                                [ DEL ]
                            </button>
                        </td>
                    </tr>
                `;
                workersTable.innerHTML += row;
            });
        });
        
        function deleteWorker(workerId) {
            if(confirm("> WARNING: CONFIRM_WORKER_DELETION ?")) {
                db.ref('workers/' + workerId).remove();
            }
        }
    </script>
</body>
</html>
