<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم النظام العائم (العقل المدبر)</title>
    <!-- استخدام Tailwind CSS لتصميم احترافي وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center">🎛️ غرفة العمليات - النظام العائم</h1>

        <!-- 1. قسم مصدر البث -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-green-400">1. مصدر البث (الرابط الأصلي)</h2>
            <div class="flex gap-4">
                <input type="text" id="sourceLink" placeholder="ضع رابط .m3u8 الأصلي هنا..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="updateSource()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded transition">تحديث وبدء البث</button>
            </div>
        </div>

        <!-- 2. قسم استبدال الدومين (Cloudflare) -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-yellow-400">2. دومين الطوارئ (Cloudflare Worker)</h2>
            <div class="flex gap-4">
                <input type="text" id="cfDomain" placeholder="مثال: https://worker-name.username.workers.dev" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="updateDomain()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded transition">استبدال وربط فوري</button>
            </div>
        </div>

        <!-- 3. قسم العمال (حسابات GitHub الفرعية) -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-purple-400">3. إدارة العمال (حسابات GitHub الفرعية)</h2>
            
            <!-- إضافة حساب جديد -->
            <div class="flex gap-4 mb-6">
                <input type="text" id="githubToken" placeholder="ضع الـ API Token للحساب الجديد هنا..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="plantScript()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded transition flex-shrink-0">زرع السكربت وربط الحساب</button>
            </div>

            <!-- شاشة المراقبة VPS Dashboard -->
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300">
                            <th class="p-3 border border-gray-600">الحساب (Token)</th>
                            <th class="p-3 border border-gray-600">السرعة / الحالة</th>
                            <th class="p-3 border border-gray-600">استهلاك الترافيك (الحد 95%)</th>
                            <th class="p-3 border border-gray-600">الإجراء اليدوي</th>
                        </tr>
                    </thead>
                    <tbody id="workersTable">
                        <!-- سيتم إضافة الحسابات هنا تلقائياً عبر JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔴 ضع إعدادات Firebase الخاصة بك هنا 🔴
        // ==========================================
        const firebaseConfig = {
            apiKey: "ضع_مفتاحك_هنا",
            authDomain: "ضع_الدومين_هنا",
            databaseURL: "ضع_رابط_قاعدة_البيانات_هنا",
            projectId: "ضع_معرف_المشروع_هنا",
            storageBucket: "ضع_مخزن_البيانات_هنا",
            messagingSenderId: "ضع_الرقم_هنا",
            appId: "ضع_معرف_التطبيق_هنا"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. تحديث مصدر البث
        function updateSource() {
            const link = document.getElementById("sourceLink").value;
            if(!link) return alert("يرجى إدخال رابط البث!");
            db.ref('settings/source').set(link);
            alert("تم تحديث رابط البث بنجاح! سيتم إرسال الأمر للعمال.");
        }

        // 2. تحديث دومين Cloudflare
        function updateDomain() {
            const domain = document.getElementById("cfDomain").value;
            if(!domain) return alert("يرجى إدخال رابط الدومين!");
            db.ref('settings/domain').set(domain);
            alert("تم ربط الدومين الجديد بجميع الحسابات بنجاح!");
        }

        // 3. زرع السكربت في حساب GitHub جديد (الهيكل الأساسي)
        async function plantScript() {
            const token = document.getElementById("githubToken").value;
            if(!token) return alert("يرجى إدخال Token!");
            
            // هنا سيتم وضع كود الاتصال بـ GitHub API لإنشاء المستودع ورفع القالب (في الخطوة 2)
            // حالياً سنقوم بحفظ الحساب في Firebase كعامل جديد لتبدأ مراقبته
            
            const workerId = 'worker_' + Math.random().toString(36).substr(2, 9);
            db.ref('workers/' + workerId).set({
                token: token,
                status: 'active',
                trafficUsage: 0, // يبدأ من 0%
                speed: 'ممتاز'
            });
            
            document.getElementById("githubToken").value = '';
            alert("تم ربط الحساب وزرع السكربت بنجاح!");
        }

        // 4. مراقبة الحسابات (Dashboard) ونظام الحماية (95%)
        db.ref('workers').on('value', (snapshot) => {
            const workersTable = document.getElementById('workersTable');
            workersTable.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                const workerId = childSnapshot.key;
                
                // نظام الحماية التلقائي: إيقاف الحساب إذا وصل 95%
                if (worker.trafficUsage >= 95 && worker.status === 'active') {
                    db.ref('workers/' + workerId + '/status').set('paused');
                    alert(`⚠️ تم إيقاف الحساب ${workerId} مؤقتاً لحمايته من الحظر (وصل ${worker.trafficUsage}%) وتم تحويل الضغط!`);
                }

                // تحديد لون الحالة
                const statusColor = worker.status === 'active' ? 'text-green-400' : 'text-red-400';
                const statusText = worker.status === 'active' ? 'نشط 🟢' : 'متوقف مؤقتاً 🔴';
                const btnAction = worker.status === 'active' ? 'إيقاف مؤقت' : 'إعادة تشغيل';
                const btnClass = worker.status === 'active' ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700';

                const row = `
                    <tr class="bg-gray-800 border-b border-gray-700 text-center">
                        <td class="p-3 font-mono text-sm">${worker.token.substring(0, 8)}...</td>
                        <td class="p-3 ${statusColor} font-bold">${statusText} - ${worker.speed}</td>
                        <td class="p-3">
                            <div class="w-full bg-gray-600 rounded-full h-4 relative">
                                <div class="${worker.trafficUsage >= 90 ? 'bg-red-500' : 'bg-blue-500'} h-4 rounded-full" style="width: ${worker.trafficUsage}%"></div>
                                <span class="absolute text-xs text-white left-1/2 top-0 transform -translate-x-1/2">${worker.trafficUsage}%</span>
                            </div>
                        </td>
                        <td class="p-3">
                            <button onclick="toggleWorkerStatus('${workerId}', '${worker.status}')" class="${btnClass} text-white text-sm py-1 px-3 rounded">
                                ${btnAction}
                            </button>
                        </td>
                    </tr>
                `;
                workersTable.innerHTML += row;
            });
        });

        // 5. التحكم اليدوي بالحسابات
        function toggleWorkerStatus(workerId, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'paused' : 'active';
            db.ref('workers/' + workerId + '/status').set(newStatus);
        }
    </script>
</body>
</html>
