<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة العمليات - النظام العائم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center border-b border-gray-700 pb-4">🎛️ العقل المدبر - غرفة العمليات</h1>

        <!-- 1. قسم مصدر البث -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-green-400 flex items-center gap-2">
                <span>📡</span> 1. مصدر البث الأصلي
            </h2>
            <div class="flex flex-col gap-3 mb-4">
                <input type="text" id="sourceLink" placeholder="ضع رابط .m3u8 أو .ts هنا (الخانة تدعم الروابط الطويلة جداً)..." class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-green-300 focus:outline-none focus:border-green-500 font-mono text-left dir-ltr">
                <button onclick="updateSource()" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition shadow">حفظ المصدر في القاعدة</button>
            </div>
            
            <!-- شاشة العرض -->
            <div class="w-full bg-black rounded-lg overflow-hidden border border-gray-700 relative mt-4">
                <div class="absolute top-2 right-2 text-xs text-gray-400 bg-gray-900 px-2 py-1 rounded opacity-80 z-10">شاشة المراقبة</div>
                <video id="previewPlayer" controls class="w-full h-48 md:h-80 bg-black object-contain"></video>
            </div>
            
            <!-- زر الاستنفار العام -->
            <button onclick="startAllWorkers()" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg text-lg flex justify-center items-center gap-2">
                <span>🚀</span> إطلاق البث وتوزيع الأحمال على جميع العمال
            </button>
        </div>

        <!-- 2. قسم استبدال الدومين -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6 border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-yellow-400 flex items-center gap-2">
                <span>🌐</span> 2. دومين الطوارئ (Cloudflare)
            </h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="cfDomain" placeholder="https://worker-node.workers.dev..." class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-yellow-300 focus:outline-none focus:border-yellow-500 font-mono text-left dir-ltr">
                <button onclick="updateDomain()" class="w-full md:w-auto bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition shadow">ربط الدومين</button>
            </div>
        </div>

        <!-- 3. قسم إدارة العمال -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-purple-400 flex items-center gap-2">
                <span>🤖</span> 3. إدارة العمال (GitHub Workers)
            </h2>
            
            <div class="flex flex-col gap-3 mb-6 bg-gray-700 p-4 rounded-lg">
                <label class="text-sm text-gray-300 font-bold">إضافة عامل جديد:</label>
                <input type="text" id="githubToken" placeholder="ضع الـ API Token للحساب الفرعي هنا..." class="w-full p-4 rounded-lg bg-gray-950 border border-gray-600 text-purple-300 focus:outline-none focus:border-purple-500 font-mono text-left dir-ltr">
                <button onclick="plantScript()" id="plantBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition shadow">زرع المحرك (FFmpeg)</button>
            </div>

            <!-- جدول العمال -->
            <div class="overflow-x-auto border border-gray-700 rounded-lg">
                <table class="w-full text-center border-collapse whitespace-nowrap">
                    <thead class="bg-gray-900">
                        <tr class="text-gray-300 border-b border-gray-700">
                            <th class="p-4 font-bold">الحساب والمستودع</th>
                            <th class="p-4 font-bold">الترافيك الفعلي</th>
                            <th class="p-4 font-bold">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="workersTable" class="divide-y divide-gray-700">
                        <!-- العمال هنا -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLovuI6IOGsl2BrIgN9CImS4FgfY9xuY",
            authDomain: "floating-project-afc8f.firebaseapp.com",
            databaseURL: "https://floating-project-afc8f-default-rtdb.firebaseio.com",
            projectId: "floating-project-afc8f",
            storageBucket: "floating-project-afc8f.firebasestorage.app",
            messagingSenderId: "937631435290",
            appId: "1:937631435290:web:127c41f413b2d34d6a1fa3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function playVideo(url) {
            const video = document.getElementById('previewPlayer');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else {
                video.src = url;
                video.play();
            }
        }

        function updateSource() {
            const link = document.getElementById("sourceLink").value;
            if(!link) return alert("يرجى إدخال رابط البث!");
            db.ref('settings/source').set(link);
            playVideo(link);
            alert("تم حفظ رابط البث في قاعدة البيانات!");
        }

        function updateDomain() {
            const domain = document.getElementById("cfDomain").value;
            if(!domain) return alert("يرجى إدخال الرابط!");
            db.ref('settings/domain').set(domain);
            alert("تم ربط الدومين الجديد!");
        }

        function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

        async function plantScript() {
            const token = document.getElementById("githubToken").value.trim();
            if(!token) return alert("يرجى إدخال Token!");
            
            const btn = document.getElementById("plantBtn");
            btn.innerText = "جاري الاتصال والزرع...";
            btn.disabled = true;

            try {
                const userRes = await fetch("https://api.github.com/user", { headers: { "Authorization": `token ${token}` } });
                if (!userRes.ok) throw new Error("التوكن غير صحيح.");
                const userData = await userRes.json();
                const username = userData.login;

                const randomId = Math.floor(Math.random() * 10000);
                const repoName = "TimeShift-Worker-" + randomId;
                
                await fetch("https://api.github.com/user/repos", {
                    method: "POST",
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify({ name: repoName, private: false, auto_init: true })
                });

                await new Promise(resolve => setTimeout(resolve, 1500));

                const workflowContent = `name: FFmpeg Stream Engine
on:
  workflow_dispatch:
jobs:
  process-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Process and Convert to PNG
        run: |
          git config --global user.name "TimeShift Worker"
          git config --global user.email "worker@timeshift.local"
          mkdir -p live_stream
          
          SOURCE_URL=$(curl -s https://floating-project-afc8f-default-rtdb.firebaseio.com/settings/source.json | tr -d '"')
          
          if [ "$SOURCE_URL" != "null" ] && [ -n "$SOURCE_URL" ]; then
            ffmpeg -i "$SOURCE_URL" -c copy -f hls -hls_time 4 -hls_list_size 5 -hls_flags delete_segments -hls_segment_filename "live_stream/segment_%03d.png" live_stream/index.m3u8 &
            
            for i in {1..30}; do
              sleep 10
              git add live_stream/*
              git commit -m "Update stream" || true
              git push origin main || true
            done
          fi
`;
                
                await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/.github/workflows/engine.yml`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify({ message: "Init Engine", content: encodeBase64(workflowContent) })
                });

                // القيمة الحقيقية للعداد تبدأ من 0
                db.ref('workers/' + username + '_' + randomId).set({
                    token: token,
                    status: 'active',
                    trafficUsage: 0,
                    repo: repoName,
                    username: username
                });
                
                document.getElementById("githubToken").value = '';
                alert(`✅ تم الزرع بنجاح في: ${repoName}`);

            } catch (error) {
                alert("❌ خطأ: " + error.message);
            } finally {
                btn.innerText = "زرع المحرك (FFmpeg)";
                btn.disabled = false;
            }
        }

        async function startWorkerAction(username, repo, token) {
            try {
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/actions/workflows/engine.yml/dispatches`, {
                    method: "POST",
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify({ ref: "main" })
                });
                if(res.ok || res.status === 204) alert(`تم التشغيل في الخادم!`);
            } catch(e) {}
        }

        async function startAllWorkers() {
            const workersRef = await db.ref('workers').once('value');
            const workers = workersRef.val();
            if (!workers) return alert("لا يوجد عمال!");
            
            for (let key in workers) {
                let worker = workers[key];
                if (worker.status === 'active') {
                    fetch(`https://api.github.com/repos/${worker.username}/${worker.repo}/actions/workflows/engine.yml/dispatches`, {
                        method: "POST",
                        headers: { "Authorization": `token ${worker.token}`, "Accept": "application/vnd.github.v3+json" },
                        body: JSON.stringify({ ref: "main" })
                    }).catch(e => {});
                }
            }
            alert("✅ تم إرسال أمر التشغيل لجميع العمال بنجاح.");
        }

        db.ref('workers').on('value', (snapshot) => {
            const workersTable = document.getElementById('workersTable');
            workersTable.innerHTML = '';
            
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                const workerId = childSnapshot.key;
                const usage = worker.trafficUsage || 0; // القيمة الحقيقية
                
                const row = `
                    <tr class="hover:bg-gray-800 transition">
                        <td class="p-4 text-right">
                            <div class="font-bold text-blue-300 text-lg">${worker.username}</div>
                            <div class="text-sm text-gray-500 font-mono">${worker.repo}</div>
                        </td>
                        <td class="p-4 w-1/3">
                            <div class="flex items-center gap-2">
                                <span class="font-bold w-10 text-left ${usage > 85 ? 'text-red-500' : 'text-green-400'}">${usage}%</span>
                                <div class="w-full bg-gray-700 rounded-full h-3">
                                    <div class="h-3 rounded-full ${usage > 85 ? 'bg-red-500' : 'bg-green-500'}" style="width: ${usage}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 flex gap-2 justify-center">
                            <button onclick="startWorkerAction('${worker.username}', '${worker.repo}', '${worker.token}')" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded shadow text-sm">
                                تشغيل فردي
                            </button>
                            <button onclick="deleteWorker('${workerId}')" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded shadow text-sm">
                                حذف
                            </button>
                        </td>
                    </tr>
                `;
                workersTable.innerHTML += row;
            });
        });
        
        function deleteWorker(workerId) {
            if(confirm("هل أنت متأكد من حذف هذا العامل؟")) db.ref('workers/' + workerId).remove();
        }
    </script>
</body>
</html>
